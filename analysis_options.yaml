include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Exclude generated Riverpod provider files from analysis
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Exclude test files from the public_member_api_docs rule
    - "test/**"
  errors:
    missing_return: error

linter:
  rules:
    # Allow print() in service layer for debug output during development
    avoid_print: false

    # Require docs on all public members — portfolio quality.
    # Note: test/ is excluded via analyzer.exclude above.
    public_member_api_docs: true

    # Prefer const constructors where possible
    prefer_const_constructors: true

    # Enforce package imports (no relative imports)
    always_use_package_imports: true

    # very_good_analysis requires this — allow it since we use it in sorting
    prefer_foreach: false

    # Allow casting from dynamic (needed for SQLite maps)
    avoid_dynamic_calls: false
