name: storage_lens
description: A cross-platform storage management tool for Android and Windows Desktop.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & dependency injection
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local database for caching scan results
  sqflite: ^2.3.3+1
  # SQLite for desktop (Windows/Linux/macOS)
  sqflite_common_ffi: ^2.3.4

  # Platform utilities
  path_provider: ^2.1.3
  path: ^1.9.0

  # Permissions (Android only at runtime, declared in manifest)
  permission_handler: ^11.3.1

  # Device info for Android SDK version detection
  device_info_plus: ^10.1.2

  # Charting
  fl_chart: ^0.70.0

  # Date/number formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Strict linting for portfolio quality
  very_good_analysis: ^6.0.0

  # Code generation for Riverpod
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

  # Mocking for unit & widget tests
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
