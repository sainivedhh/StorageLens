name: StorageLens CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build -d

      - name: Analyze Code
        shell: bash
        run: |
          set +e
          flutter analyze > analyze-output.txt 2>&1
          analyze_status=$?
          set -e
          cat analyze-output.txt

          if grep -Eq '^[[:space:]]*(error|warning) •' analyze-output.txt; then
            echo "Analysis found warnings or errors."
            exit 1
          fi

          if [ "$analyze_status" -ne 0 ]; then
            if grep -Eq '[0-9]+ issues? found' analyze-output.txt; then
              echo "Analyzer reported informational lints only; continuing."
            else
              echo "Analyzer failed for a reason other than informational lints."
              exit "$analyze_status"
            fi
          fi

      - name: Run Tests
        run: flutter test

  build_apk:
    name: Build Android APK
    needs: analyze_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Restore missing Android project files
        shell: bash
        run: |
          # This repository currently contains the app manifest but is missing
          # the Android Gradle project, wrapper, and MainActivity. Generate the
          # standard Flutter Android scaffold while preserving app permissions.
          cp android/app/src/main/AndroidManifest.xml /tmp/storage-lens-AndroidManifest.xml
          flutter create \
            --platforms=android \
            --project-name storage_lens \
            --org com.sainivedhh \
            --no-pub \
            /tmp/storage_lens_android_scaffold
          cp -a /tmp/storage_lens_android_scaffold/android/. android/
          cp /tmp/storage-lens-AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build -d

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
